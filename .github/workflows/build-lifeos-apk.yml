name: Gerar APK do LifeOS

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Extrair projeto Android
        run: unzip -q LifeOS-Android-source.zip -d projeto
      - name: Gerar APK
        working-directory: projeto/android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeOS-APK
          path: projeto/android/app/build/outputs/apk/debug/app-debug.apk
